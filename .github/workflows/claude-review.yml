name: Claude PR Review

# Reusable workflow. Each repository calls it from a small caller workflow
# (see claude-review-caller.yml). Requires the org secret CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token` as the dedicated Team-plan user).

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    # Skip drafts, plus two kinds of PR that cannot run this job:
    # - forks: a fork's pull_request run gets no secrets and a read-only token
    # - dependabot: reads Dependabot secrets, and the action refuses bot actors
    # - coderabbitai: it also triggers pull_request events (e.g. while it updates the PR), and the
    #   action then fails with "Workflow initiated by non-human actor"; skip those runs instead of
    #   allowing the bot, so the review still runs for every human push
    # Adding any label fires a `labeled` event; only the deep-review label should start a run.
    if: |
      (github.event.action != 'labeled' || github.event.label.name == 'deep-review') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'coderabbitai[bot]'
    # Private repos use our self-hosted pool (GitHub-hosted minutes are billed); public
    # repos use GitHub-hosted runners, which are free for them and keep untrusted PR
    # code off our machines.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CLAUDE_CODE_VERSION: "2.1.308"
    # One review at a time per PR: a new push or the label being added replaces a run in progress.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Never block merging because the review job itself failed.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # gh pr view reads statusCheckRollup, which 403s without this.
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # claude-code-action installs Claude Code itself with `curl claude.ai/install.sh`:
      # 3 attempts, 5 s apart. claude.ai rate-limits per IP and our runners share one,
      # so a burst of PRs gets 429 on all three and the job fails without reviewing
      # anything. Install it here instead: reuse a cached/pre-installed copy, and
      # retry with a long, jittered backoff. The version is the one the action pins
      # (src/entrypoints/run.ts); bump it together with the action.
      - name: Restore Claude Code
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/claude
            ~/.local/share/claude
          key: claude-code-${{ runner.os }}-${{ runner.arch }}-${{ env.CLAUDE_CODE_VERSION }}

      - name: Install Claude Code
        id: claude
        # Explicit shell: the default `bash -e {0}` has no pipefail, so a 429 from curl
        # would feed bash empty input, exit 0, and end the retry loop as a "success".
        shell: bash
        run: |
          BIN="$HOME/.local/bin/claude"
          if ! "$BIN" --version 2>/dev/null | grep -qF "$CLAUDE_CODE_VERSION"; then
            installed=false
            for i in 1 2 3 4 5 6; do
              # Success means the pinned version actually runs, not just that the pipe exited 0.
              if curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION" \
                && "$BIN" --version 2>/dev/null | grep -qF "$CLAUDE_CODE_VERSION"; then
                installed=true
                break
              fi
              delay=$(( 20 * i + RANDOM % 15 ))
              echo "Claude Code install attempt $i failed; retrying in ${delay}s"
              sleep "$delay"
            done
            "$installed" || { echo "::error::Could not install Claude Code after 6 attempts"; exit 1; }
          fi
          "$BIN" --version
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.claude.outputs.bin }}
          track_progress: true
          # Keep the full agent transcript out of the job logs: Actions logs of public
          # repositories are world-readable. To debug a silent run, enable it on a
          # short-lived branch and remove it again.
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ## Deep Code Review

            Perform a **thorough, senior-level code review of this PR**. Your goal is to find real bugs and risks, not to produce generic style feedback.

            First understand the PR's intent and inspect the surrounding code, callers, dependencies, tests, and relevant repository patterns. **Do not review the diff in isolation.**

            Look for:

            * Logic and correctness bugs, including edge cases and incorrect assumptions
            * Regressions and backwards-compatibility issues
            * Error handling and failure/retry behavior
            * Race conditions, concurrency and lifecycle problems
            * Data integrity, persistence and state-management issues
            * Security vulnerabilities
            * Performance and resource-usage regressions
            * Missing validation, tests, migrations, or related changes
            * Architectural or maintainability problems that create meaningful risk

            Think adversarially: try to construct concrete scenarios that would break the implementation, including malformed/empty/unexpected input, failures, retries, concurrency, restarts, stale state, and high load where relevant.

            **Do not report speculative or purely stylistic issues.** Every finding must have a credible failure scenario and be supported by the actual code.

            For each finding provide:

            * **Severity:** P0 Critical / P1 High / P2 Medium / P3 Low
            * **Location:** file and line
            * **Problem:** what is wrong
            * **Impact:** why it matters
            * **Scenario:** how it can actually happen
            * **Fix:** recommended solution

            Prioritize **high-signal findings over quantity**. Re-check every finding before reporting it and do not claim to have run tests or tools unless you actually did.

            Finish with:

            1. Overall risk: Low / Medium / High / Critical
            2. Merge recommendation
            3. The most important issues to fix
            4. Brief positive observations, if any

            ## How to post the review

            * This workflow also runs on every push to the PR. Before commenting, read your existing review comments and the PR conversation. Do not repeat findings you already reported; only add new ones, and mention in the summary when earlier findings look fixed by the latest commits.
            * Post each finding as an inline comment on its file and line, using the format above.
            * Post the final summary (overall risk, merge recommendation, key issues, positives) as one top-level PR comment.
            * If you find no real issues, say so in the summary rather than inventing findings.
            * Do not push commits or modify any files.
          # Opus when the PR has the `deep-review` label, Sonnet otherwise.
          claude_args: >-
            --model ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --effort high
            --allowedTools
            "Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"
          # --allowedTools REPLACES the default tool list rather than adding to it, so every
          # tool the prompt needs has to be named here. This exact value is what the
          # bugsee-cli / bugsee-react-native / bugsee-kotlin-multiplatform review workflows used.
