name: Claude PR Review

# Intended to be run org-wide via an org ruleset ("Require workflows to pass").
# Requires org secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token` as the
# dedicated Team-plan user) shared with all repositories.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip drafts, plus two kinds of PR that cannot run this job:
    # - forks: a fork's pull_request run gets no secrets and a read-only token
    # - dependabot: reads Dependabot secrets, and the action refuses bot actors
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never block merging because the review job itself failed.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # gh pr view reads statusCheckRollup, which 403s without this.
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Keep the full agent transcript out of the job logs: Actions logs of public
          # repositories are world-readable. To debug a silent run, enable it on a
          # short-lived branch and remove it again.
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ## Deep Code Review

            Perform a **thorough, senior-level code review of this PR**. Your goal is to find real bugs and risks, not to produce generic style feedback.

            First understand the PR's intent and inspect the surrounding code, callers, dependencies, tests, and relevant repository patterns. **Do not review the diff in isolation.**

            Look for:

            * Logic and correctness bugs, including edge cases and incorrect assumptions
            * Regressions and backwards-compatibility issues
            * Error handling and failure/retry behavior
            * Race conditions, concurrency and lifecycle problems
            * Data integrity, persistence and state-management issues
            * Security vulnerabilities
            * Performance and resource-usage regressions
            * Missing validation, tests, migrations, or related changes
            * Architectural or maintainability problems that create meaningful risk

            Think adversarially: try to construct concrete scenarios that would break the implementation, including malformed/empty/unexpected input, failures, retries, concurrency, restarts, stale state, and high load where relevant.

            **Do not report speculative or purely stylistic issues.** Every finding must have a credible failure scenario and be supported by the actual code.

            For each finding provide:

            * **Severity:** P0 Critical / P1 High / P2 Medium / P3 Low
            * **Location:** file and line
            * **Problem:** what is wrong
            * **Impact:** why it matters
            * **Scenario:** how it can actually happen
            * **Fix:** recommended solution

            Prioritize **high-signal findings over quantity**. Re-check every finding before reporting it and do not claim to have run tests or tools unless you actually did.

            Finish with:

            1. Overall risk: Low / Medium / High / Critical
            2. Merge recommendation
            3. The most important issues to fix
            4. Brief positive observations, if any

            ## How to post the review

            * This workflow also runs on every push to the PR. Before commenting, read your existing review comments and the PR conversation. Do not repeat findings you already reported; only add new ones, and mention in the summary when earlier findings look fixed by the latest commits.
            * Post each finding as an inline comment on its file and line, using the format above.
            * Post the final summary (overall risk, merge recommendation, key issues, positives) as one top-level PR comment.
            * If you find no real issues, say so in the summary rather than inventing findings.
            * Do not push commits or modify any files.
          claude_args: >-
            --allowedTools
            "Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"
          # --allowedTools REPLACES the default tool list rather than adding to it, so every
          # tool the prompt needs has to be named here. This exact value is what the
          # bugsee-cli / bugsee-react-native / bugsee-kotlin-multiplatform review workflows used.